<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0c1222">
  <meta name="application-name" content="Lanturn">
  <meta name="description" content="Lanturn: your light home. Night walking routes that show what is lit, and keep themselves current.">
  <title>Lanturn: night walking routes</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="map" aria-label="Map of walking routes"></div>

  <!-- ===== Planning ===== -->
  <header id="trip" class="card plan-only">
    <div class="brand"><img src="/logo.svg" alt="Lanturn" width="109" height="18"></div>
    <div class="trip-rows">
      <button class="place" id="btn-from" aria-label="Change start">
        <span class="dot dot-from" aria-hidden="true"></span>
        <span class="place-text"><small>From</small><b id="from-name">…</b></span>
      </button>
      <button class="place" id="btn-to" aria-label="Change destination">
        <span class="dot dot-to" aria-hidden="true"></span>
        <span class="place-text"><small>To</small><b id="to-name">…</b></span>
      </button>
    </div>
    <button id="btn-swap" class="icon-btn" aria-label="Swap start and destination">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 20l-4-4M17 20V4M17 4l4 4"/></svg>
    </button>
    <div class="when" role="group" aria-label="When" id="when">
      <button class="when-btn" data-when="now" aria-pressed="true">Leave now</button>
      <button class="when-btn" data-when="leave" aria-pressed="false">Leave at</button>
      <button class="when-btn" data-when="arrive" aria-pressed="false">Arrive by</button>
    </div>
    <button class="when-detail" id="when-detail" hidden aria-label="Change time"></button>
  </header>

  <div class="legend plan-only" id="legend" hidden>
    <span><i class="lg lg-lit"></i>Lit</span>
    <span><i class="lg lg-unlit"></i>Unlit</span>
    <span><i class="lg lg-unknown"></i>Unknown</span>
  </div>
  <div class="demo-pill plan-only" id="demo-pill" hidden><span class="tag tag-replay">DEMO</span>Replay data, not live</div>

  <section id="sheet" class="sheet plan-only" aria-live="polite">
    <div class="handle" aria-hidden="true"></div>
    <div id="notice" class="notice" hidden></div>
    <button id="btn-start" class="start" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5 20.5 21 12 17.2 3.5 21z"/></svg>
      Start!
    </button>
    <div id="cards" class="cards"></div>
    <footer class="foot">
      <button id="btn-agent" class="agent-chip" aria-label="Open disruption details">
        <span class="pulse" id="agent-dot" aria-hidden="true"></span>
        <span id="agent-chip-text">Checking TfL…</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <p class="disclaimer">Street conditions from open data. Not a guarantee that a route is safe.</p>
    </footer>
  </section>

  <!-- ===== Navigation preview ===== -->
  <section id="nav-top" class="nav-top card nav-only" aria-live="polite">
    <div class="nav-arrow" id="nav-arrow" aria-hidden="true"></div>
    <div class="nav-text">
      <div class="nav-dist" id="nav-dist"></div>
      <div class="nav-instr" id="nav-instr"></div>
      <div class="nav-then" id="nav-then"></div>
    </div>
    <button id="btn-call" class="call-btn" aria-label="Start video call with the walking companion">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="13" height="12" rx="3"/><path d="M15.5 10.5 21.5 7v10l-6-3.5z"/></svg>
    </button>
  </section>

  <aside id="call" class="call nav-only" hidden aria-live="polite">
    <video id="call-video" playsinline autoplay></video>
    <div class="call-state" id="call-state"></div>
    <button id="btn-retry-call" class="call-retry" hidden>Retry</button>
    <button id="btn-hangup" class="hangup" aria-label="Hang up">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 9c-3.6 0-7 1-9.4 2.9-.8.6-.8 1.700-.3 2.500l1.200 1.800c.5.7 1.400.9 2.100.5l2.500-1.300c.6-.3.9-.9.9-1.500v-1.300c2-.5 4-.5 6 0v1.300c0 .6.3 1.200.9 1.500l2.500 1.300c.7.4 1.600.2 2.100-.5l1.200-1.800c.5-.8.5-1.900-.3-2.500C19 10 15.600 9 12 9z"/></svg>
    </button>
  </aside>

  <section id="nav-bottom" class="nav-bottom card nav-only">
    <div class="nav-stats">
      <span class="nav-min"><b id="nav-min"></b><small>min</small></span>
      <span class="nav-sub" id="nav-sub"></span>
    </div>
    <button id="btn-exit" class="exit">Exit navigation</button>
  </section>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-body" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h2 id="modal-title">Title</h2>
        <button class="icon-btn" data-close aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div id="modal-content" class="modal-content"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="/mapstyle.js"></script>
  <script src="/app.js"></script>
</body>
</html>
